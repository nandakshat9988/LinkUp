<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Buddy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Find Activities Near You</h1>

        <!-- AUTH: everything below requires a JWT, so login/register comes first -->
        <div class="card" id="auth-card">
            <h2>Login / Register</h2>
            <input type="text" id="reg-name" placeholder="Name (register only)">
            <input type="email" id="auth-email" placeholder="Email">
            <input type="password" id="auth-password" placeholder="Password">
            <button onclick="register()">Register</button>
            <button onclick="login()">Login</button>
            <p id="auth-status"></p>
        </div>

        <div class="card" id="app-card" style="display:none;">
            <p>Logged in as <span id="current-user"></span> (<span id="current-skill"></span>)
               <button onclick="logout()">Logout</button></p>
        </div>

        <div class="card">
            <h2>Post an Activity</h2>
            <input type="text" id="activityType" placeholder="Activity type (e.g., cricket)">
            <input type="text" id="activity" placeholder="Description (e.g., Need 2 players for box cricket)">
            <select id="skillLevel">
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
            </select>
            <button onclick="postActivity()">Post Activity with my Location</button>
            <p id="status"></p>
        </div>

        <div class="card">
            <h2>Suggested For You (Hybrid ML Recommendations)</h2>
            <button onclick="getRecommendations()">Find Nearby Matches</button>
            <ul id="recommendation-list"></ul>
        </div>

        <div class="card">
            <h2>Nearby (Geospatial Index, Dynamic Radius)</h2>
            <button onclick="findNearby()">Show Nearby Activities</button>
            <p id="radius-status"></p>
            <ul id="nearby-list"></ul>
        </div>

        <div class="card">
            <h2>All Recent Posts</h2>
            <button onclick="loadAllPosts()">Refresh Feed</button>
            <ul id="posts-list"></ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
