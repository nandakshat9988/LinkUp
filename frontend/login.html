<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LinkUp</title>
    <meta name="description" content="Sign in to your LinkUp account to find and join local activities.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-page-container">
        <main class="auth-card">
            <header class="auth-header">
                <a href="index.html" class="brand-logo">
                    <div class="logo-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                        </svg>
                    </div>
                    <span class="brand-text">LinkUp</span>
                </a>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to find and join nearby matches</p>
            </header>

            <form onsubmit="login(event)" id="login-form">
                <div class="form-group">
                    <label for="login-email" class="form-label">Email Address</label>
                    <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="login-password" class="form-label">Password</label>
                    <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-submit-btn" style="margin-top: 10px;">
                    Sign In
                </button>
            </form>

            <div id="login-status" class="status-message"></div>

            <footer class="auth-footer">
                <p>Don't have an account? <a href="register.html">Create one now</a></p>
                <p style="margin-top: 10px;"><a href="index.html" style="color: var(--text-muted); font-size: 13px;">← Back to Home</a></p>
            </footer>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
