<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LinkUp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="center-page">
    <main class="auth-box">
        <p class="eyebrow">LINKUP</p>
        <h1>Register</h1>
        <p class="muted">Create your account and choose your activity skill level.</p>

        <form onsubmit="register(event)">
            <label for="register-name">Name</label>
            <input type="text" id="register-name" placeholder="Your name" required>

            <label for="register-email">Email</label>
            <input type="email" id="register-email" placeholder="you@example.com" required>

            <label for="register-password">Password</label>
            <input type="password" id="register-password" placeholder="Create a password" required>

            <label for="register-skill">Skill level</label>
            <select id="register-skill">
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
            </select>

            <button class="btn primary" type="submit">Create account</button>
        </form>

        <p id="register-status" class="status-text"></p>
        <p class="page-link">Already have an account? <a href="login.html">Login</a></p>
    </main>

    <script src="app.js"></script>
</body>
</html>
